<div class="poster">
  <div class="cover"></div>
  <div class="inner">
    <span class="tag">AI 与人的处境</span>
    <h1>AI替我们干活之后<br>劳动还属于人吗</h1>
    <p class="lead">效率不是唯一尺度。真正的问题是，人是否仍能影响目标、规则、过程和结果。</p>
    <div class="core">AI 时代最重要的问题，不是人还要不要劳动，而是劳动还是否属于人。</div>
    <div class="item"><div class="num">1</div><div><h2>参与设定目标</h2><p>AI 可以优化目标，却不能自动证明目标值得追求。</p></div></div>
    <div class="item"><div class="num">2</div><div><h2>理解评价标准</h2><p>劳动者应知道任务为何被分配、记录和评价。</p></div></div>
    <div class="item"><div class="num">3</div><div><h2>能够修改过程</h2><p>保留补充背景、提出异议、暂停执行和要求人工复核的权利。</p></div></div>
    <div class="item"><div class="num">4</div><div><h2>让权力与责任匹配</h2><p>承担后果的人，也应拥有拒绝、解释、纠错和停止的权力。</p></div></div>
    <div class="foot"><div class="brand">烨然漫笔<span>让 AI 成为工具，让劳动者仍然是作者</span></div><div class="date">2026.09.08<br>艾AI</div></div>
  </div>
