<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="烨然漫笔文学与创作 Markdown 阅读器">
<title>阅读 · 文学与创作</title>
<link rel="icon" href="data:,">
<script>
  try {
    const savedTheme = localStorage.getItem('literature-theme');
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    const savedSize = localStorage.getItem('literature-font-size');
    if (savedSize) document.documentElement.style.setProperty('--reading-size', savedSize + 'px');
  } catch (error) {}
</script>
<link rel="stylesheet" href="styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script defer src="reader.js"></script>
</head>
<body>
<div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
<header class="reader-bar">
  <a class="reader-back" href="index.html">← 返回文学与创作</a>
  <div class="reader-current" id="reader-current">正在载入</div>
  <div class="reader-tools" aria-label="阅读设置">
    <button class="tool-button" id="font-smaller" type="button" aria-label="减小字号">A−</button>
    <button class="tool-button" id="font-larger" type="button" aria-label="增大字号">A+</button>
    <button class="tool-button" id="theme-toggle" type="button" aria-label="切换明暗主题">◐</button>
    <a class="source-link" id="source-link" href="#" target="_blank" rel="noopener">查看 Markdown</a>
  </div>
</header>

<main class="reader-layout">
  <aside class="toc" aria-label="文章目录">
    <div class="toc-label">CONTENTS</div>
    <nav id="toc-list"></nav>
  </aside>

  <article class="reader-article">
    <header class="article-masthead" id="article-masthead">
      <div class="article-label" id="article-label">文学与创作</div>
      <h1 id="article-title">正在打开文字</h1>
      <div class="article-subtitle" id="article-subtitle"></div>
      <div class="article-info" id="article-info"></div>
    </header>

    <div class="markdown-body" id="markdown-body" aria-live="polite">
      <p>正在从 Markdown 生成阅读页面。</p>
    </div>

    <section class="reader-end" id="reader-end" hidden>
      <h2>同一创作档案</h2>
      <div class="related-list" id="related-list"></div>
    </section>
  </article>
</main>
</body>
</html>
